[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-issue-security-gate"
version = "0.1.0"
description = "Deterministic security screening for untrusted coding-agent task intake."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
