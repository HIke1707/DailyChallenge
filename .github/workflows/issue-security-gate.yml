name: Agent Issue Security Gate

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  screen-intake:
    # Issue comments on pull requests are not coding-task intake events.
    if: github.event_name == 'issues' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the security gate
        run: python -m pip install -e 20260727/agent-issue-security-gate

      - name: Build an intake document from the GitHub event
        uses: actions/github-script@v8
        env:
          INTAKE_PATH: ${{ runner.temp }}/agent-issue-intake.json
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            // All event fields are serialized as data; they are never interpolated into shell commands.
            const intake = {
              source_type: 'github_issue',
              title: issue.title || '',
              body: issue.body || '',
              comments: comments.map((comment) => comment.body || ''),
              // GitHub Issue events do not include extracted attachment text. URLs remain in body/comments
              // and are screened by SEC-006; attachment extraction must be a separate, sandboxed service.
              attachments: [],
            };
            fs.writeFileSync(process.env.INTAKE_PATH, JSON.stringify(intake), 'utf8');

      - name: Scan untrusted Issue intake
        id: scan
        continue-on-error: true
        working-directory: 20260727/agent-issue-security-gate
        env:
          INTAKE_PATH: ${{ runner.temp }}/agent-issue-intake.json
          REPORT_DIRECTORY: ${{ runner.temp }}/agent-issue-reports
        run: |
          python -m issue_guard.cli \
            --input "$INTAKE_PATH" \
            --policy policies/default-policy.json \
            --output "$REPORT_DIRECTORY" \
            --report-name issue-result

      - name: Retain security report for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-issue-security-report-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-issue-reports/issue-result.json
            ${{ runner.temp }}/agent-issue-reports/issue-result.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Apply the gate decision label
        if: always()
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ runner.temp }}/agent-issue-reports/issue-result.json
        with:
          script: |
            const fs = require('fs');
            const decisionLabels = {
              allow: { name: 'agent-security-allow', color: '0e8a16' },
              review: { name: 'agent-security-review', color: 'fbca04' },
              block: { name: 'agent-security-block', color: 'b60205' },
              error: { name: 'agent-security-error', color: '6e5494' },
            };
            let decision = 'error';

            try {
              const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
              if (Object.hasOwn(decisionLabels, result.decision)) {
                decision = result.decision;
              }
            } catch (error) {
              core.warning(`Security report unavailable: ${error.message}`);
            }

            for (const label of Object.values(decisionLabels)) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: 'Set automatically by Agent Issue Security Gate',
                });
              }
            }

            const issueNumber = context.payload.issue.number;
            for (const label of Object.values(decisionLabels)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [decisionLabels[decision].name],
            });

            core.setOutput('decision', decision);
            if (decision === 'error') {
              core.setFailed('The security gate did not produce a valid report; no Agent may be started.');
            }
