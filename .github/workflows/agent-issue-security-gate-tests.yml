name: Agent Issue Security Gate Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the security gate
        run: python -m pip install -e 20260727/agent-issue-security-gate

      - name: Run deterministic security-gate tests
        working-directory: 20260727/agent-issue-security-gate
        run: python -m unittest discover -s tests -v
